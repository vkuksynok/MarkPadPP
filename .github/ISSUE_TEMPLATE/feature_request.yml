name: Feature request
description: Suggest an improvement or new capability for MarkPad++.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the
        [existing issues](https://github.com/vkuksynok/MarkPadPP/issues) first, and
        the [documented limits](https://github.com/vkuksynok/MarkPadPP/blob/main/docs/index.md#performance-and-limits)
        — some features (live side-by-side preview, HTML export, regex search,
        footnotes, and others) are already known to be unimplemented.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or limitation you are running into, not only the solution.
      placeholder: "When I ..., I can't ... because ..."
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: What would you like MarkPad++ to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or thought about.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, examples from other editors, or other context.
    validations:
      required: false
